name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Run lint checks
        run: scripts/lint.sh

  shell-tests:
    name: Test (${{ matrix.shell }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shell:
          - bash
          - dash
          - zsh
          - ksh

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bash \
            dash \
            git \
            ksh \
            zsh \
            ca-certificates \
            util-linux

      - name: Install Bats test dependencies
        run: tests/setup.sh

      - name: Run shell test suite
        env:
          SHELL_UNDER_TEST: ${{ matrix.shell }}
        run: tests/run.sh
